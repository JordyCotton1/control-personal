<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<!-- IMPORTANTE PARA MÓVILES -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Control de Personal</title>

<style>
:root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #3b82f6;
    --success: #22c55e;
    --danger: #ef4444;
    --warning: #f59e0b;
    --text: #e2e8f0;
}

body {
    margin: 0;
    font-family: Arial;
    background: var(--bg);
    color: var(--text);
}

/* ===== PANTALLAS ===== */
.screen {
    display: none;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
.active { display: flex; }

/* ===== CAJA PRINCIPAL ===== */
.box {
    background: var(--card);
    padding: 25px;
    border-radius: 15px;
    width: 300px;
    text-align: center;
}

/* ===== BOTONES ===== */
button, input, textarea {
    width: 100%;
    padding: 10px;
    margin: 6px 0;
    border-radius: 8px;
    border: none;
}

/* ===== COLORES ===== */
.primary { background: var(--accent); color:white; }
.success { background: var(--success); color:white; }
.warning { background: var(--warning); color:white; }
.danger { background: var(--danger); color:white; }

/* ===== APP ===== */
.app {
    display: none;
    max-width: 420px;
    margin: 30px auto;
}

/* GRID DEFAULT */
.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.log {
    margin-top: 15px;
    max-height: 300px;
    overflow-y: auto;
}

.item {
    background: #0f172a;
    padding: 10px;
    border-radius: 10px;
    margin: 5px 0;
}

.user {
    color: #38bdf8;
    font-weight: bold;
}

.time {
    font-size: 11px;
    color: #94a3b8;
}

/* =========================
   📱 MOBILE
========================= */
body.mobile .box {
    width: 92%;
    padding: 18px;
}

body.mobile .app {
    max-width: 95%;
    margin: 10px auto;
}

body.mobile .grid {
    grid-template-columns: 1fr; /* botones en columna */
}

/* =========================
   📲 TABLET
========================= */
body.tablet .box {
    width: 70%;
}

body.tablet .app {
    max-width: 600px;
}

body.tablet .grid {
    grid-template-columns: 1fr 1fr;
}

/* =========================
   💻 DESKTOP
========================= */
body.desktop .box {
    width: 300px;
}

body.desktop .app {
    max-width: 420px;
}
</style>
</head>

<body>

<!-- INICIO -->
<div class="screen active" id="inicio">
    <div class="box">
        <h2>Ingresar como:</h2>
        <button class="primary" onclick="mostrar('personalLogin')">👷 Personal</button>
        <button class="success" onclick="mostrar('gerenteLogin')">👔 Gerente</button>
    </div>
</div>

<!-- PERSONAL -->
<div class="screen" id="personalLogin">
    <div class="box">
        <input id="nombre" placeholder="Nombre">
        <input id="apellido" placeholder="Apellido">
        <button class="primary" onclick="loginPersonal()">Entrar</button>
    </div>
</div>

<!-- GERENTE -->
<div class="screen" id="gerenteLogin">
    <div class="box">
        <input id="clave" type="password" placeholder="Clave">
        <button class="success" onclick="loginGerente()">Entrar</button>
    </div>
</div>

<!-- APP -->
<div class="app" id="app">
    <div class="box">
        <h3 id="titulo"></h3>

        <div id="acciones">
            <div class="grid">
                <button class="warning" onclick="registrar('🍳 Desayuno')">Desayuno</button>
                <button class="success" onclick="registrar('🥪 Refacción')">Refacción</button>
                <button class="primary" onclick="registrar('🍽️ Almuerzo')">Almuerzo</button>
                <button class="danger" onclick="registrar('🚪 Salida')">Salida</button>
            </div>

            <textarea id="mensaje" placeholder="Ej: Voy al baño..."></textarea>
            <button class="primary" onclick="enviarMensaje()">Enviar aviso</button>
        </div>

        <div class="log" id="registro" style="display:none;"></div>
        <div class="log" id="registroPersonal"></div>

        <button id="btnBorrar" class="danger" onclick="borrarHistorial()" style="display:none;">
            🗑️ Borrar historial
        </button>

        <button class="danger" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>
</div>

<script>
let usuario = "";
let rol = "";

/* ========= DETECTAR DISPOSITIVO ========= */
function detectarDispositivo() {
    const w = window.innerWidth;

    document.body.classList.remove("mobile", "tablet", "desktop");

    if (w <= 600) {
        document.body.classList.add("mobile");
    } else if (w <= 1024) {
        document.body.classList.add("tablet");
    } else {
        document.body.classList.add("desktop");
    }
}

window.addEventListener("resize", detectarDispositivo);
window.addEventListener("load", detectarDispositivo);

/* ========= LOGIN ========= */
function mostrar(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function loginPersonal() {
    let n = nombre.value;
    let a = apellido.value;
    if (!n || !a) return alert("Completa datos");

    usuario = n + " " + a;
    rol = "personal";
    iniciar();
}

function loginGerente() {
    if (clave.value !== "12345678") return alert("Clave incorrecta");

    usuario = "Gerente";
    rol = "gerente";
    iniciar();
}

function mostrarPersonal(texto) {
    let cont = document.getElementById("registroPersonal");

    let html = `
    <div class="item">
        <span class="user">${usuario}</span><br>
        ${texto}
        <div class="time">${new Date().toLocaleTimeString()}</div>
    </div>`;

    cont.innerHTML = html + cont.innerHTML;
}

function iniciar() {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    app.style.display = "block";

    titulo.innerText = "👤 " + usuario;

    if (rol === "gerente") {
        acciones.style.display = "none";
        btnBorrar.style.display = "block";
        registro.style.display = "block";
    } else {
        registro.style.display = "none";
        btnBorrar.style.display = "none";
    }
}
</script>

<!-- Firebase igual que el tuyo -->
<script type="module">
/* (TU FIREBASE SIN CAMBIOS) */
</script>

</body>
</html>
