<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Control de Personal PRO</title>

<style>
:root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #3b82f6;
    --success: #22c55e;
    --danger: #ef4444;
    --warning: #f59e0b;
    --text: #e2e8f0;
}

body {
    margin: 0;
    font-family: Arial;
    background: var(--bg);
    color: var(--text);
}

.screen {
    display: none;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
.active { display: flex; }

.box {
    background: var(--card);
    padding: 25px;
    border-radius: 15px;
    width: 300px;
    text-align: center;
}

button, input, textarea {
    width: 100%;
    padding: 10px;
    margin: 6px 0;
    border-radius: 8px;
    border: none;
}

.primary { background: var(--accent); color:white; }
.success { background: var(--success); color:white; }
.warning { background: var(--warning); color:white; }
.danger { background: var(--danger); color:white; }

.app {
    display: none;
    max-width: 420px;
    margin: 30px auto;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.log {
    margin-top: 15px;
    max-height: 300px;
    overflow-y: auto;
}

.item {
    background: #0f172a;
    padding: 10px;
    border-radius: 10px;
    margin: 5px 0;
}

.user {
    color: #38bdf8;
    font-weight: bold;
}

.time {
    font-size: 11px;
    color: #94a3b8;
}
</style>
</head>

<body>

<!-- INICIO -->
<div class="screen active" id="inicio">
    <div class="box">
        <h2>Ingresar como:</h2>
        <button class="primary" onclick="mostrar('personalLogin')">👷 Personal</button>
        <button class="success" onclick="mostrar('gerenteLogin')">👔 Gerente</button>
    </div>
</div>

<!-- PERSONAL -->
<div class="screen" id="personalLogin">
    <div class="box">
        <input id="nombre" placeholder="Nombre">
        <input id="apellido" placeholder="Apellido">
        <button class="primary" onclick="loginPersonal()">Entrar</button>
    </div>
</div>

<!-- GERENTE -->
<div class="screen" id="gerenteLogin">
    <div class="box">
        <input id="clave" type="password" placeholder="Clave">
        <button class="success" onclick="loginGerente()">Entrar</button>
    </div>
</div>

<!-- APP -->
<div class="app" id="app">
    <div class="box">
        <h3 id="titulo"></h3>

        <!-- PERSONAL -->
        <div id="acciones">
            <div class="grid">
                <button class="warning" onclick="registrar('🍳 Desayuno')">Desayuno</button>
                <button class="success" onclick="registrar('🥪 Refacción')">Refacción</button>
                <button class="primary" onclick="registrar('🍽️ Almuerzo')">Almuerzo</button>
                <button class="danger" onclick="registrar('🚪 Salida')">Salida</button>
            </div>

            <textarea id="mensaje" placeholder="Ej: Voy al baño..."></textarea>
            <button class="primary" onclick="enviarMensaje()">Enviar aviso</button>
        </div>

        <!-- HISTORIAL -->
        <div class="log" id="registro"></div>

        <!-- BOTÓN BORRAR SOLO GERENTE -->
        <button id="btnBorrar" class="danger" onclick="borrarHistorial()" style="display:none;">
            🗑️ Borrar historial
        </button>

        <button class="danger" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>
</div>

<script>
let usuario = "";
let rol = "";
let intervalo;

// CAMBIAR PANTALLA
function mostrar(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

// LOGIN PERSONAL
function loginPersonal() {
    let n = nombre.value;
    let a = apellido.value;
    if (!n || !a) return alert("Completa datos");

    usuario = n + " " + a;
    rol = "personal";
    iniciar();
}

// LOGIN GERENTE
function loginGerente() {
    if (clave.value !== "12345678") return alert("Clave incorrecta");

    usuario = "Gerente";
    rol = "gerente";
    iniciar();
}

// INICIAR
function iniciar() {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    app.style.display = "block";

    titulo.innerText = "👤 " + usuario;

    if (rol === "gerente") {
        acciones.style.display = "none";
        btnBorrar.style.display = "block"; // 👈 mostrar botón
        mostrarRegistros();
        intervalo = setInterval(mostrarRegistros, 2000);
    } else {
        btnBorrar.style.display = "none";
        mostrarSesion();
    }
}

// GUARDAR
function guardar(texto) {
    let hora = new Date().toLocaleTimeString();

    let registros = JSON.parse(localStorage.getItem("registros")) || [];
    registros.unshift({ usuario, texto, hora });
    localStorage.setItem("registros", JSON.stringify(registros));

    let sesion = JSON.parse(sessionStorage.getItem("sesion")) || [];
    sesion.unshift({ texto, hora });
    sessionStorage.setItem("sesion", JSON.stringify(sesion));
}

// MOSTRAR GERENTE
function mostrarRegistros() {
    let registros = JSON.parse(localStorage.getItem("registros")) || [];
    registro.innerHTML = "";

    registros.forEach(r => {
        registro.innerHTML += `
        <div class="item">
            <span class="user">${r.usuario}</span><br>
            ${r.texto}
            <div class="time">${r.hora}</div>
        </div>`;
    });
}

// MOSTRAR PERSONAL
function mostrarSesion() {
    let sesion = JSON.parse(sessionStorage.getItem("sesion")) || [];
    registro.innerHTML = "";

    sesion.forEach(r => {
        registro.innerHTML += `
        <div class="item">
            ${r.texto}
            <div class="time">${r.hora}</div>
        </div>`;
    });
}

// ACCIONES
function registrar(t) {
    guardar(t);
    if (rol === "personal") mostrarSesion();
}

function enviarMensaje() {
    let m = mensaje.value;
    if (!m) return alert("Escribe algo");

    guardar("💬 " + m);
    mensaje.value = "";

    if (rol === "personal") mostrarSesion();
}

// 🗑️ BORRAR HISTORIAL
function borrarHistorial() {
    if (!confirm("¿Seguro que quieres borrar todo el historial?")) return;

    localStorage.removeItem("registros");
    mostrarRegistros();
}

// CERRAR SESIÓN
function cerrarSesion() {
    clearInterval(intervalo);

    if (rol === "personal") {
        sessionStorage.clear();
    }

    location.reload();
}
</script>

</body>
</html>
