<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dependencia de monitores </title>

<style>
:root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #3b82f6;
    --success: #22c55e;
    --danger: #ef4444;
    --warning: #f59e0b;
    --text: #e2e8f0;
}

body {
    margin: 0;
    font-family: Arial;
    background: var(--bg);
    color: var(--text);
}

.screen {
    display: none;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
.active { display: flex; }

.box {
    background: var(--card);
    padding: 25px;
    border-radius: 15px;
    width: 300px;
    text-align: center;
}

button, input, textarea {
    width: 100%;
    padding: 10px;
    margin: 6px 0;
    border-radius: 8px;
    border: none;
}

.primary { background: var(--accent); color:white; }
.success { background: var(--success); color:white; }
.warning { background: var(--warning); color:white; }
.danger { background: var(--danger); color:white; }

.app {
    display: none;
    max-width: 420px;
    margin: 30px auto;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.log {
    margin-top: 15px;
    max-height: 300px;
    overflow-y: auto;
}

.item {
    background: #0f172a;
    padding: 10px;
    border-radius: 10px;
    margin: 5px 0;
}

.user {
    color: #38bdf8;
    font-weight: bold;
}

.time {
    font-size: 11px;
    color: #94a3b8;
}


</style>
</head>
<script>
function detectarDispositivo() {
    const w = window.innerWidth;

    document.body.classList.remove("mobile", "tablet", "desktop");

    if (w <= 600) {
        document.body.classList.add("mobile");
    } else if (w <= 1024) {
        document.body.classList.add("tablet");
    } else {
        document.body.classList.add("desktop");
    }
}

window.addEventListener("load", detectarDispositivo);
window.addEventListener("resize", detectarDispositivo);
</script>
<body>

<!-- INICIO -->
<div class="screen active" id="inicio">
    <div class="box">

        <!-- LOGO -->
        <img src="MUNI_LOGO2.png" style="width:120px; margin-bottom:10px;">

        <!-- TÍTULO -->
        <h2>Dependencia de monitores</h2>
        <h4>LIC. JAQUELINE</h4>

        <hr style="margin:10px 0; opacity:0.3;">

        <h3>Ingresar como:</h3>

        <button class="primary" onclick="mostrar('personalLogin')">👷 Personal</button>
        <button class="success" onclick="mostrar('gerenteLogin')">👔 Gerente</button>
    </div>
</div>

<!-- PERSONAL -->
<div class="screen" id="personalLogin">
    <div class="box">
        <input id="nombre" placeholder="Nombre">
        <input id="apellido" placeholder="Apellido">
        <button class="primary" onclick="loginPersonal()">Entrar</button>
    </div>
</div>

<!-- GERENTE -->
<div class="screen" id="gerenteLogin">
    <div class="box">
        <input id="clave" type="password" placeholder="Clave">
        <button class="success" onclick="loginGerente()">Entrar</button>
    </div>
</div>

<!-- APP -->
<div class="app" id="app">
    <div class="box">
        <h3 id="titulo"></h3>

        <div id="acciones">
            <div class="grid">
                <button class="warning" onclick="registrar('🍳 Desayuno')">Desayuno</button>
                <button class="success" onclick="registrar('🥪 Refacción')">Refacción</button>
                <button class="primary" onclick="registrar('🍽️ Almuerzo')">Almuerzo</button>
                <button class="danger" onclick="registrar('🚪 Salida')">Salida</button>
            </div>

            <textarea id="mensaje" placeholder="Ej: Voy al baño..."></textarea>
            <button class="primary" onclick="enviarMensaje()">Enviar aviso</button>
        </div>

        <!-- SOLO GERENTE VE TODO -->
        <div class="log" id="registro" style="display:none;"></div>
        <div class="log" id="registroPersonal"></div>

        <button id="btnBorrar" class="danger" onclick="borrarHistorial()" style="display:none;">
            🗑️ Borrar historial
        </button>

        <button class="danger" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>
</div>

<script>
let usuario = "";
let rol = "";

/* ========= LOGIN ========= */
function mostrar(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function loginPersonal() {
    let n = nombre.value;
    let a = apellido.value;
    if (!n || !a) return alert("Completa datos");

    usuario = n + " " + a;
    rol = "personal";
    iniciar();
}

function loginGerente() {
    if (clave.value !== "12345678") return alert("Clave incorrecta");

    usuario = "Gerente";
    rol = "gerente";
    iniciar();
}
    function mostrarPersonal(texto) {
    let cont = document.getElementById("registroPersonal");

    let html = `
    <div class="item">
        <span class="user">${usuario}</span><br>
        ${texto}
        <div class="time">${new Date().toLocaleTimeString()}</div>
    </div>`;

    cont.innerHTML = html + cont.innerHTML;
}

function iniciar() {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    app.style.display = "block";

    titulo.innerText = "👤 " + usuario;

    if (rol === "gerente") {
        acciones.style.display = "none";
        btnBorrar.style.display = "block";
        registro.style.display = "block";
    } else {
        registro.style.display = "none";
        btnBorrar.style.display = "none";
    }
}

/* ========= FIREBASE ========= */
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
getDatabase,
ref,
push,
onValue,
remove
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAJwm2hMDS5H5imRjlg_LDhK1MkZjKfX_M",
  authDomain: "cafeteria-app1.firebaseapp.com",
  databaseURL: "https://cafeteria-app1-default-rtdb.firebaseio.com",
  projectId: "cafeteria-app1",
  storageBucket: "cafeteria-app1.firebasestorage.app",
  messagingSenderId: "350426514665",
  appId: "1:350426514665:web:79a545b0ebc4a9329e9c78"
};

const appFB = initializeApp(firebaseConfig);
const db = getDatabase(appFB);
const cloudRef = ref(db, "registros");

/* ========= GUARDAR GLOBAL ========= */
window.guardar = function(texto) {
    push(cloudRef, {
        usuario,
        texto,
        hora: new Date().toLocaleTimeString()
    });
};

window.registrar = function(t) {
    guardar(t);

    // 👇 PERSONAL VE SOLO LO SUYO
    if (rol === "personal") {
        mostrarPersonal(t);
    }
};

window.enviarMensaje = function() {
    let m = mensaje.value;
    if (!m) return alert("Escribe algo");

    guardar("💬 " + m);
    mensaje.value = "";
};

/* ========= GERENTE VE TODO (NUEVO ARRIBA) ========= */
onValue(cloudRef, (snap) => {
    if (rol !== "gerente") return;

    let data = [];

    snap.forEach(item => {
        data.push(item.val());
    });

    // 🔥 más nuevo primero
    data.reverse();

    registro.innerHTML = "";

    data.forEach(r => {
        registro.innerHTML += `
        <div class="item">
            <span class="user">${r.usuario}</span><br>
            ${r.texto}
            <div class="time">${r.hora}</div>
        </div>`;
    });
});

/* ========= BORRAR GLOBAL ========= */
window.borrarHistorial = function() {
    if (confirm("¿Borrar historial global?")) {
        remove(cloudRef);
    }
};

/* ========= CERRAR ========= */
window.cerrarSesion = function() {
    location.reload();
};
</script>

</body>
</html>
