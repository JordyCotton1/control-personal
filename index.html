<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Personal PRO</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f172a;
    color: white;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 10px;
}

.box {
    background: #1e293b;
    padding: 15px;
    border-radius: 15px;
}

input, button, textarea {
    width: 100%;
    padding: 10px;
    margin: 6px 0;
    border-radius: 8px;
    border: none;
}

button { cursor: pointer; }

.primary { background: #3b82f6; color: white; }
.success { background: #22c55e; color: white; }
.danger { background: #ef4444; color: white; }

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.log {
    margin-top: 10px;
    max-height: 350px;
    overflow-y: auto;
}

.item {
    background: #0f172a;
    padding: 10px;
    margin: 5px 0;
    border-radius: 10px;
}

.user { color: #38bdf8; font-weight: bold; }
.time { font-size: 11px; color: #94a3b8; }

@media (max-width:600px){
    .grid { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<div class="container">
<div class="box">

<h2>Control de Personal</h2>

<input id="nombre" placeholder="Nombre">
<input id="apellido" placeholder="Apellido">
<button class="primary" onclick="loginPersonal()">Entrar Personal</button>

<input id="clave" type="password" placeholder="Clave gerente">
<button class="success" onclick="loginGerente()">Entrar Gerente</button>

<hr>

<div id="panel" style="display:none">

<h3 id="usuario"></h3>

<div id="acciones">
<div class="grid">
<button onclick="registrar('🍳 Desayuno')">Desayuno</button>
<button onclick="registrar('🥪 Refacción')">Refacción</button>
<button onclick="registrar('🍽️ Almuerzo')">Almuerzo</button>
<button onclick="registrar('🚪 Salida')">Salida</button>
</div>

<textarea id="mensaje" placeholder="Mensaje..."></textarea>
<button class="primary" onclick="enviar()">Enviar</button>
</div>

<div class="log" id="log"></div>

<button class="danger" onclick="borrar()">🗑️ Borrar historial</button>
<button class="danger" onclick="cerrar()">Cerrar sesión</button>

</div>

</div>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
getDatabase,
ref,
push,
onValue,
remove
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* 🔥 TU CONFIG FIREBASE (REEMPLAZA ESTO) */
const firebaseConfig = {
apiKey: "TU_API_KEY",
authDomain: "TU_PROYECTO.firebaseapp.com",
databaseURL: "https://TU_PROYECTO.firebaseio.com",
projectId: "TU_PROYECTO"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const refDB = ref(db, "registros");

let user = "";
let rol = "";

/* LOGIN PERSONAL */
window.loginPersonal = function () {
user = nombre.value + " " + apellido.value;
rol = "personal";
iniciar();
};

/* LOGIN GERENTE */
window.loginGerente = function () {
if (clave.value !== "1234") return alert("Clave incorrecta");
user = "Gerente";
rol = "gerente";
iniciar();
};

/* INICIAR */
function iniciar() {
panel.style.display = "block";
usuario.innerText = user;

if (rol === "gerente") {
acciones.style.display = "none";
}

onValue(refDB, (snap) => {
log.innerHTML = "";
snap.forEach(item => {
let d = item.val();
log.innerHTML = `
<div class="item">
<span class="user">${d.user}</span><br>
${d.text}
<div class="time">${d.time}</div>
</div>
` + log.innerHTML;
});
});
}

/* GUARDAR */
window.registrar = function (t) {
push(refDB, {
user,
text: t,
time: new Date().toLocaleTimeString()
});
};

window.enviar = function () {
if (!mensaje.value) return alert("Escribe algo");

push(refDB, {
user,
text: "💬 " + mensaje.value,
time: new Date().toLocaleTimeString()
});

mensaje.value = "";
};

/* BORRAR HISTORIAL */
window.borrar = function () {
if (confirm("¿Borrar todo el historial?")) {
remove(refDB);
}
};

/* CERRAR */
window.cerrar = function () {
location.reload();
};
</script>

</body>
</html>
