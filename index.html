<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Control de Personal</title>

<style>
:root {
    --bg:#0f172a;
    --card:#1e293b;
    --accent:#3b82f6;
    --success:#22c55e;
    --danger:#ef4444;
    --text:#e2e8f0;
}

body{
    margin:0;
    font-family:Arial;
    background:var(--bg);
    color:var(--text);
}

.screen{display:none;justify-content:center;align-items:center;height:100vh;}
.active{display:flex;}

.box{
    background:var(--card);
    padding:25px;
    border-radius:15px;
    width:300px;
    text-align:center;
}

button,input,textarea{
    width:100%;
    padding:10px;
    margin:6px 0;
    border-radius:8px;
    border:none;
}

.primary{background:var(--accent);color:white;}
.success{background:var(--success);color:white;}
.danger{background:var(--danger);color:white;}

.app{
    display:none;
    max-width:420px;
    margin:30px auto;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.log{
    margin-top:15px;
    max-height:300px;
    overflow-y:auto;
}

.item{
    background:#0f172a;
    padding:10px;
    border-radius:10px;
    margin:5px 0;
}

.user{color:#38bdf8;font-weight:bold;}
.time{font-size:11px;color:#94a3b8;}

.ok{
    margin-top:10px;
    color:#22c55e;
    font-size:13px;
}
</style>
</head>

<body>

<div class="screen active" id="inicio">
    <div class="box">
        <h2>Ingresar como:</h2>
        <button class="primary" onclick="mostrar('personalLogin')">👷 Personal</button>
        <button class="success" onclick="mostrar('gerenteLogin')">👔 Gerente</button>
    </div>
</div>

<div class="screen" id="personalLogin">
    <div class="box">
        <input id="nombre" placeholder="Nombre">
        <input id="apellido" placeholder="Apellido">
        <button class="primary" onclick="loginPersonal()">Entrar</button>
    </div>
</div>

<div class="screen" id="gerenteLogin">
    <div class="box">
        <input id="clave" type="password" placeholder="Clave">
        <button class="success" onclick="loginGerente()">Entrar</button>
    </div>
</div>

<div class="app" id="app">
    <div class="box">
        <h3 id="titulo"></h3>

        <div id="acciones">
            <div class="grid">
                <button class="primary" onclick="registrar('🍳 Desayuno')">Desayuno</button>
                <button class="success" onclick="registrar('🥪 Refacción')">Refacción</button>
                <button class="danger" onclick="registrar('🚪 Salida')">Salida</button>
            </div>

            <textarea id="mensaje" placeholder="Mensaje"></textarea>
            <button class="primary" onclick="enviarMensaje()">Enviar aviso</button>

            <div class="ok" id="estado"></div>
        </div>

        <div class="log" id="registro"></div>

        <button id="btnBorrar" class="danger" onclick="borrarHistorial()" style="display:none;">
            🗑️ Borrar historial
        </button>

        <button class="danger" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>
</div>

<script>
let usuario="";
let rol="";
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
getDatabase,
ref,
push,
onValue,
remove
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAJwm2hMDS5H5imRjlg_LDhK1MkZjKX_F",
  authDomain: "cafeteria-app1.firebaseapp.com",
  databaseURL: "https://cafeteria-app1-default-rtdb.firebaseio.com",
  projectId: "cafeteria-app1",
};

const appFB = initializeApp(firebaseConfig);
const db = getDatabase(appFB);
const refDB = ref(db,"registros");

function guardar(texto){
    push(refDB,{
        usuario: window.usuario,
        texto,
        ts: Date.now()
    });

    // 👇 aviso de enviado
    if(window.rol === "personal"){
        document.getElementById("estado").innerText = "✔ Enviado correctamente";
        setTimeout(()=>{
            document.getElementById("estado").innerText = "";
        },2000);
    }
}

function render(data){
    data.sort((a,b)=>b.ts-a.ts);

    let html="";

    data.forEach(r=>{

        // 🔥 FILTRO IMPORTANTE
        if(window.rol === "personal"){
            if(r.usuario !== window.usuario) return;
        }

        html += `
        <div class="item">
            <span class="user">${r.usuario}</span><br>
            ${r.texto}
            <div class="time">${new Date(r.ts).toLocaleTimeString()}</div>
        </div>`;
    });

    registro.innerHTML = html;
}

onValue(refDB,(snap)=>{
    let data=[];
    snap.forEach(i=>data.push(i.val()));
    render(data);
});

/* EXPORTAR FUNCIONES */
window.guardar = guardar;

window.registrar = function(t){
    guardar(t);
};

window.enviarMensaje = function(){
    let m = mensaje.value;
    if(!m) return alert("Escribe algo");

    guardar("💬 "+m);
    mensaje.value="";
};

window.borrarHistorial = function(){
    if(confirm("¿Borrar todo?")){
        remove(refDB);
    }
};
</script>

<script>
function mostrar(id){
    document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

function loginPersonal(){
    usuario = nombre.value+" "+apellido.value;
    rol="personal";
    iniciar();
}

function loginGerente(){
    if(clave.value!=="12345678") return alert("Clave incorrecta");
    usuario="Gerente";
    rol="gerente";
    iniciar();
}

function iniciar(){
    document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
    app.style.display="block";

    titulo.innerText="👤 "+usuario;

    if(rol==="gerente"){
        acciones.style.display="none";
        btnBorrar.style.display="block";
    } else {
        btnBorrar.style.display="none";
    }
}

function cerrarSesion(){
    location.reload();
}
</script>

</body>
</html>
